<!DOCTYPE html>
<html>
    <head>
        <title>Input HTML</title>
    </head>

    <body>
        <header>

        </header>

        <main>
            <div>
                Text:
                <input type="text" />
            </div>
            <div>
                Number
                <input type="number" />
            </div>
            <div>
                Email
                <input type="email" />
            </div>
            <div>
                Password
                <input type="password" />
            </div>
            <div>
                Search
                <input type="search" />
            </div>
            <div>
                Date
                <input type="date" />
            </div>
            <div>
                Time
                <input type="time" />
            </div>
            <div>
                local
                <input type="datetime-local" />
            </div>
            <div>
                checkbox
                <input type="checkbox" />
            </div>
            <div>
                radio
                <input type="radio" />
            </div>
            <div>
                range
                <input type="range" />
            </div>
            <div>
                color
                <input type="color" />
            </div>
            <div>
                file
                <input type="file" />
            </div>
            <div>
                submit
                <input type="submit" />
            </div>
            <div>
                hidden
                <input type="hidden" />

                <section>
                    <textarea rows="6" cols="20">
                        Belajar
                        Dasar
                        Pemrograman
                        Web
                    </textarea>
                </section>
            </div>

            <!-- Label Element -->
            <div>
                <label for="email">Email</label>
                <br>
                <input type="email" id="email" />
            </div>

            <div>
                <label for="password">Password</label>
                <br>
                <input type="password" id="password">
            </div>

            <!--PlaceHolder & Required -->
            <div>
                <label for="email">Email</label>
                <br />
                <input type="email" id="email" placeholder="example@mail.com" required />
            </div>

            <div>
                <label for="password">Password</label>
                <br />
                <input type="password" id="password" placeholder="********" required>
            </div>
            
        </main>
    </body>
</html>
